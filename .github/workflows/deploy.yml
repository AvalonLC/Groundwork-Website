name: Deploy to Cloudflare Pages

# Auto-deploy: every push to main builds the site and publishes it to
# Cloudflare Pages (project: groundwork-crm-marketing). No sandbox
# session, no manually-pasted token required — auth comes from the
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets below.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allows manually re-running a deploy from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=groundwork-crm-marketing --branch=main
