name: One-off — Provision production D1 database

# Manually-triggered utility workflow to create the production D1 database
# and apply migrations, using the same CLOUDFLARE_API_TOKEN/ACCOUNT_ID repo
# secrets as deploy.yml (already proven working). Safe to re-run: `d1 create`
# no-ops with a clear message if the DB already exists, and migrations are
# idempotent (IF NOT EXISTS guards throughout). Not wired to any push
# trigger — workflow_dispatch only, run once then safe to delete.
on:
  workflow_dispatch: {}

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: List existing D1 databases (diagnostic)
        run: npx wrangler d1 list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create production D1 database (no-op if it already exists)
        run: npx wrangler d1 create groundwork-crm-marketing-production || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: List again to confirm + print the database_id
        run: npx wrangler d1 list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations to production D1
        run: npx wrangler d1 migrations apply groundwork-crm-marketing-production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify tables exist
        run: npx wrangler d1 execute groundwork-crm-marketing-production --remote --command="SELECT name FROM sqlite_master WHERE type='table'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
