name: One-off — Check Pages project D1 binding

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest deployment detail
        run: |
          DEPLOY_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/groundwork-crm-marketing/deployments?per_page=1" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          echo "Deploy ID: $DEPLOY_ID"
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/groundwork-crm-marketing/deployments/$DEPLOY_ID" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | python3 -m json.tool
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
